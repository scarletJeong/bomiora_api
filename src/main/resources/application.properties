# 기본 설정 (공통)
spring.profiles.active=dev

# 서버 포트
server.port=9000

# 데이터베이스 설정 (공통)
spring.datasource.url=jdbc:mysql://bomiora0.mycafe24.com:3306/bomiora0
spring.datasource.username=bomiora0
spring.datasource.password=Bomiora135!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정 (공통)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# SQL 포맷팅 (가독성 향상)
spring.jpa.properties.hibernate.format_sql=true
# SQL 파라미터 값 출력 (실제 바인딩된 값 확인)
spring.jpa.properties.hibernate.use_sql_comments=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS 설정 (공통)
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# 이미지 베이스 URL 설정
app.image.base-url=https://bomiora.kr
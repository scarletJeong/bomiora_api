# AWS EC2 환경 설정
server.port=8080

# EC2 로컬 MariaDB 설정
spring.datasource.url=jdbc:mysql://localhost:3306/bomiora?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=bomiora
spring.datasource.password=bomiora123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# CORS 설정 (카페24 Flutter Web 허용)
spring.web.cors.allowed-origins=http://localhost:5000,https://bomiora0.mycafe24.com
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

